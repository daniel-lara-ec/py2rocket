[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py2rocket"
version = "0.4.4"
description = "DSL para generar pipelines de Stratio Rocket desde Python"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "DSL Team"}
]
keywords = ["stratio", "rocket", "spark", "dsl", "pipeline", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
py2rocket = "py2rocket.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/py2rocket"
Documentation = "https://github.com/yourusername/py2rocket#readme"
Repository = "https://github.com/yourusername/py2rocket"

[tool.setuptools.packages.find]
where = ["."]
include = ["py2rocket*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
python_files = ["tests/test_*.py"]
